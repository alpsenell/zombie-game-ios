<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#060c10">
  <title>Last Stand: Deadzone</title>
  <style>
    :root{color-scheme:dark;font-family:Impact,Haettenschweiler,"Arial Narrow Bold",system-ui,sans-serif}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03070a;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}#hud{position:fixed;inset:0;z-index:2;pointer-events:none;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));text-shadow:0 2px 5px #000}.top{display:flex;justify-content:space-between;align-items:flex-start}#wave{color:#eef6f1;font-size:clamp(22px,5vw,38px);letter-spacing:1px}#wave small,#score small{display:block;margin-top:2px;color:#d94d43;font:800 10px system-ui,sans-serif;letter-spacing:1.7px}#score{text-align:right;color:#fff;font-size:clamp(19px,4.5vw,32px)}#score small{color:#ffc653}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}#crosshair{width:28px;height:28px}.line{position:absolute;background:#e7fff2;box-shadow:0 0 5px #000}.line.v{width:2px;height:28px;left:13px}.line.h{height:2px;width:28px;top:13px}#hit{width:44px;height:44px;opacity:0;transition:opacity .05s,transform .05s;transform:translate(-50%,-50%) scale(.3)}#hit.show{opacity:1;transform:translate(-50%,-50%) scale(1)}#hit:before,#hit:after{content:"";position:absolute;left:21px;width:2px;height:44px;background:#fff;transform:rotate(45deg)}#hit:after{transform:rotate(-45deg)}#health{position:absolute;left:50%;bottom:max(131px,calc(116px + env(safe-area-inset-bottom)));transform:translateX(-50%);width:min(43vw,210px);text-align:center;color:#fff;font-size:18px}.bar{height:7px;border:1px solid #697878;border-radius:6px;overflow:hidden;background:#080d0f}.bar i{display:block;width:100%;height:100%;background:linear-gradient(90deg,#bf2e2a,#ffc348);box-shadow:0 0 12px #e24937;transition:width .15s}#weapon{position:absolute;right:18px;bottom:max(19px,env(safe-area-inset-bottom));text-align:right}#gun-name{color:#d4ddda;font:800 10px system-ui,sans-serif;letter-spacing:1.7px;margin-bottom:2px}#ammo{color:#fff;line-height:.78;font-size:clamp(38px,10vw,62px)}#ammo span{font-size:.45em;color:#94a0a5}.control{pointer-events:auto;position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.2);background:rgba(6,16,20,.2)}#stick{width:112px;height:112px;bottom:max(18px,env(safe-area-inset-bottom));left:18px}#stick-dot{position:absolute;inset:31px;border-radius:50%;background:rgba(202,226,231,.3);border:1px solid rgba(255,255,255,.2)}#fire{width:92px;height:92px;right:17px;bottom:max(96px,calc(78px + env(safe-area-inset-bottom)));border-color:rgba(255,109,80,.8);background:radial-gradient(circle,rgba(237,74,51,.64),rgba(98,19,14,.12));box-shadow:inset 0 0 18px rgba(255,130,82,.5),0 0 20px rgba(194,41,25,.3);color:white;font:900 17px system-ui,sans-serif;letter-spacing:.5px}#reload{pointer-events:auto;position:absolute;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:11px 14px;border:1px solid rgba(255,255,255,.3);border-radius:5px;background:rgba(5,10,13,.78);box-shadow:0 3px 12px #0008;color:#eaf2ed;font:800 10px system-ui,sans-serif;letter-spacing:1px}#message{position:absolute;left:50%;top:29%;transform:translate(-50%,-50%);color:#fff;text-align:center;letter-spacing:2px;font-size:clamp(26px,8vw,52px);white-space:nowrap;opacity:0;transition:opacity .2s}#message strong{display:block;margin-top:8px;color:#ffbf4b;font:800 .42em system-ui,sans-serif;letter-spacing:3px}#damage{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse,transparent 42%,rgba(205,27,20,.72));mix-blend-mode:screen;transition:opacity .12s}#intro{position:fixed;z-index:5;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:linear-gradient(#03101875,#020507e8),url('assets/deadzone-street.png') center/cover}#intro.hidden{display:none}.logo{color:#e8efe9;font-size:clamp(42px,13vw,80px);line-height:.76;letter-spacing:2px;text-shadow:0 5px 0 #132326,0 10px 24px #000}.logo em{display:block;color:#d24a3d;font-style:normal;font-size:.52em;letter-spacing:8px;margin-top:18px}.brief{max-width:370px;margin:30px auto 20px;color:#c2cfcd;font:500 13px/1.55 system-ui,sans-serif}#start{border:0;border-radius:3px;padding:17px 33px;background:#d44d39;color:#fff;box-shadow:0 4px 0 #79251e,0 8px 22px #000;font:900 16px system-ui,sans-serif;letter-spacing:2px}.tips{margin-top:26px;color:#a2afb0;font:11px system-ui,sans-serif;letter-spacing:.5px}@media(hover:hover){#fire{cursor:pointer}}
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"><div class="top"><div id="wave">WAVE 01<small id="alive">ZOMBIES REMAINING: 0</small></div><div id="score">000000<small>SCORE</small></div></div><div id="message"></div><div id="damage"></div><div id="crosshair" class="center"><i class="line v"></i><i class="line h"></i></div><div id="hit" class="center"></div><div id="health"><span id="health-num">100</span><div class="bar"><i id="health-fill"></i></div></div><div id="stick" class="control"><div id="stick-dot"></div></div><button id="fire" class="control">FIRE</button><button id="reload">RELOAD</button><div id="weapon"><div id="gun-name">M4A1<br>ASSAULT RIFLE</div><div id="ammo">30<span>/120</span></div></div></div>
  <section id="intro"><div><div class="logo">LAST STAND<em>DEADZONE</em></div><p class="brief">A fully 3D survival zone. Move freely, look around the city, and stop the infected before they close the distance.</p><button id="start">TAP TO DEPLOY</button><div class="tips">LEFT STICK: MOVE &nbsp;•&nbsp; DRAG: LOOK &nbsp;•&nbsp; HOLD FIRE: SHOOT</div></div></section>
  <script type="module" src="game.js"></script>
</body>
</html>
